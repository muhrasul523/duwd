<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Sistem Manajemen Mukerwil & Mukerda</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <style>
    @import url('https://fonts.googleapis.com/css2?family=SF+Pro+Display:wght@400;500;600;700&display=swap');
    body {
      background: radial-gradient(circle at top, #ffffff, #f0f4f8 100%);
      font-family: -apple-system, BlinkMacSystemFont, 'SF Pro Display', sans-serif;
      color: #333; min-height: 100vh; overflow-x: hidden;
    }
    .glass-apple {
      background: rgba(255, 255, 255, 0.7);
      backdrop-filter: blur(20px); -webkit-backdrop-filter: blur(20px);
      border: 1px solid rgba(255, 255, 255, 0.5);
      box-shadow: 0 10px 30px rgba(0, 0, 0, 0.05);
    }
    .input-apple {
      width: 100%; padding: 0.8rem 1rem; border-radius: 12px;
      background: rgba(255,255,255,0.8); border: 1px solid #e0e5ea;
      outline: none; transition: all 0.3s ease; font-size: 0.95rem; font-weight: 500;
      box-shadow: inset 0 2px 4px rgba(0,0,0,0.02);
    }
    .input-apple:focus {
      border-color: #007aff; background: #ffffff;
      box-shadow: 0 0 0 4px rgba(0, 122, 255, 0.1);
    }
    .btn-apple {
      background: linear-gradient(180deg, #288cff 0%, #007aff 100%);
      color: white; border-radius: 12px; font-weight: 600;
      transition: all 0.3s ease; box-shadow: 0 4px 12px rgba(0, 122, 255, 0.3);
    }
    .btn-apple:hover { transform: scale(1.02); box-shadow: 0 6px 16px rgba(0, 122, 255, 0.4); }
    
    .radio-card { display: none; }
    .radio-card:checked + label {
      border-color: #007aff; background: #f0f8ff; color: #007aff; font-weight: 600;
    }
    .radio-label {
      border: 1px solid #e0e5ea; border-radius: 12px; padding: 0.8rem; text-align: center;
      cursor: pointer; transition: all 0.2s; background: white; color: #666;
    }
  </style>
</head>
<body class="p-4 md:p-8 flex justify-center items-start pb-20">

  <div id="appView" class="max-w-3xl w-full space-y-6 mt-4 animate-fade-in">
    <div class="glass-apple p-6 md:p-10 rounded-3xl">
      <div class="text-center flex flex-col items-center mb-8">
        <!-- Logo diklik buka Admin -->
        <img src="https://wahdah.or.id/wp-content/uploads/2021/10/Logo-WI-2021.png" alt="Logo WI" class="w-24 h-24 mb-4 object-contain cursor-pointer transition transform hover:scale-110" onclick="openAdmin()">
        <h1 class="text-2xl md:text-3xl font-bold tracking-tight mb-2">Manajemen Mukerwil & Mukerda</h1>
        <p class="text-gray-500 font-medium text-sm">Departemen Urusan Wilayah dan Daerah</p>
      </div>

      <div class="space-y-6" id="mainForm">
        <!-- WA Input -->
        <div>
          <label class="block text-xs font-semibold text-gray-500 mb-1">WA Penanggung Jawab</label>
          <input type="text" id="waInput" class="input-apple" placeholder="Mulai dengan angka 08..." oninput="formatWA(this)">
        </div>

        <!-- Kegiatan -->
        <div>
          <label class="block text-xs font-semibold text-gray-500 mb-2">Pilih Kegiatan</label>
          <div class="grid grid-cols-2 gap-3">
            <div>
              <input type="radio" name="kegiatan" id="optMukerwil" value="Mukerwil" class="radio-card" onchange="toggleKegiatan()">
              <label for="optMukerwil" class="block radio-label">Mukerwil</label>
            </div>
            <div>
              <input type="radio" name="kegiatan" id="optMukerda" value="Mukerda" class="radio-card" onchange="toggleKegiatan()">
              <label for="optMukerda" class="block radio-label">Mukerda</label>
            </div>
          </div>
        </div>

        <!-- DPW / DPD -->
        <div id="wilayahContainer" class="hidden">
          <label class="block text-xs font-semibold text-gray-500 mb-1" id="lblWilayah">Pilih Wilayah</label>
          <select id="selWilayah" class="input-apple"></select>
        </div>

        <!-- Jadwal -->
        <div class="grid grid-cols-2 gap-4">
          <div>
            <label class="block text-xs font-semibold text-gray-500 mb-1">Jadwal Mulai</label>
            <input type="datetime-local" id="jadwalMulai" class="input-apple">
          </div>
          <div>
            <label class="block text-xs font-semibold text-gray-500 mb-1">Jadwal Selesai</label>
            <input type="datetime-local" id="jadwalSelesai" class="input-apple">
          </div>
        </div>

        <!-- Model Pelaksanaan & Kehadiran -->
        <div class="grid grid-cols-1 md:grid-cols-2 gap-6">
          <div>
            <label class="block text-xs font-semibold text-gray-500 mb-2">Pelaksanaan</label>
            <div class="grid grid-cols-3 gap-2">
              <div><input type="radio" name="pelaksanaan" id="pl1" value="Full Offline" class="radio-card"><label for="pl1" class="block radio-label text-xs">Offline</label></div>
              <div><input type="radio" name="pelaksanaan" id="pl2" value="Full Online" class="radio-card"><label for="pl2" class="block radio-label text-xs">Online</label></div>
              <div><input type="radio" name="pelaksanaan" id="pl3" value="Hybrid" class="radio-card"><label for="pl3" class="block radio-label text-xs">Hybrid</label></div>
            </div>
          </div>
          <div>
            <label class="block text-xs font-semibold text-gray-500 mb-2">Kehadiran Pendamping</label>
            <div class="grid grid-cols-3 gap-2">
              <div><input type="radio" name="kehadiran" id="kh1" value="Full Offline" class="radio-card"><label for="kh1" class="block radio-label text-xs">Offline</label></div>
              <div><input type="radio" name="kehadiran" id="kh2" value="Full Online" class="radio-card"><label for="kh2" class="block radio-label text-xs">Online</label></div>
              <div><input type="radio" name="kehadiran" id="kh3" value="Hybrid" class="radio-card"><label for="kh3" class="block radio-label text-xs">Hybrid</label></div>
            </div>
          </div>
        </div>

        <!-- Tanggungan -->
        <div>
          <label class="block text-xs font-semibold text-gray-500 mb-2">Tanggungan</label>
          <div class="space-y-2">
            <label class="flex items-center space-x-3 text-sm cursor-pointer"><input type="checkbox" id="chkHonor" value="Honorarium/Uang Saku" class="w-4 h-4 rounded text-blue-500" onchange="toggleHonor()"> <span>Honorarium / Uang Saku</span></label>
            <label class="flex items-center space-x-3 text-sm cursor-pointer"><input type="checkbox" id="chkTiket" value="Tiket/Transportasi" class="w-4 h-4 rounded text-blue-500"> <span>Tiket / Dana Transportasi</span></label>
            <label class="flex items-center space-x-3 text-sm cursor-pointer"><input type="checkbox" id="chkInap" value="Penginapan" class="w-4 h-4 rounded text-blue-500"> <span>Penginapan</span></label>
          </div>
        </div>

        <!-- Nominal -->
        <div id="nominalContainer" class="hidden">
          <label class="block text-xs font-semibold text-gray-500 mb-1">Nominal (Rp)</label>
          <input type="text" id="inpNominal" class="input-apple" placeholder="Rp 0" oninput="formatRupiah(this)">
          <input type="hidden" id="realNominal" value="0">
        </div>

        <!-- Usulan Pendamping -->
        <div class="space-y-4 p-4 bg-gray-50 rounded-2xl border border-gray-100">
          <h3 class="font-semibold text-sm text-gray-700">Usulan Pendamping</h3>
          <div id="usulanContainer"></div>
        </div>

        <!-- Hal Dikuatkan -->
        <div>
          <label class="block text-xs font-semibold text-gray-500 mb-1">Hal yang perlu dikuatkan</label>
          <textarea id="inpFokus" class="input-apple" rows="2" placeholder="Tuliskan poin penting..."></textarea>
        </div>

        <!-- Keterangan -->
        <div>
          <label class="block text-xs font-semibold text-gray-500 mb-1">Keterangan Lainnya (Opsional)</label>
          <textarea id="inpKet" class="input-apple" rows="2" placeholder="Catatan tambahan..."></textarea>
        </div>

        <button onclick="submitData()" id="btnSubmit" class="w-full py-4 btn-apple text-lg mt-4 shadow-lg flex justify-center items-center gap-2">
          Simpan Data
        </button>
      </div>
    </div>
  </div>

  <!-- ADMIN VIEW -->
  <div id="adminView" class="hidden w-full max-w-6xl glass-apple rounded-3xl p-6 md:p-8 mt-4 mx-auto animate-fade-in shadow-2xl">
    <div class="flex justify-between items-center mb-6">
      <h2 class="text-2xl font-bold flex items-center gap-3"><img src="https://wahdah.or.id/wp-content/uploads/2021/10/Logo-WI-2021.png" class="w-10"> Dashboard Admin</h2>
      <button onclick="closeAdmin()" class="bg-gray-100 px-4 py-2 rounded-lg text-sm font-semibold hover:bg-gray-200 transition">✕ Tutup</button>
    </div>

    <!-- Search & Filter -->
    <div class="flex gap-4 mb-6">
      <input type="text" id="adSearch" placeholder="Cari data..." class="input-apple w-1/3" onkeyup="filterAdmin()">
      <select id="adFilterKeg" class="input-apple w-1/4" onchange="filterAdmin()">
        <option value="">Semua Kegiatan</option>
        <option value="Mukerwil">Mukerwil</option>
        <option value="Mukerda">Mukerda</option>
      </select>
    </div>

    <div class="overflow-x-auto bg-white rounded-xl border border-gray-100 shadow-inner">
      <table class="w-full text-sm text-left">
        <thead class="bg-gray-50 text-gray-500 font-semibold border-b">
          <tr>
            <th class="px-4 py-3 cursor-pointer" onclick="sortAdmin('tanggal')">Tanggal ⇅</th>
            <th class="px-4 py-3 cursor-pointer" onclick="sortAdmin('pic')">PIC ⇅</th>
            <th class="px-4 py-3 cursor-pointer" onclick="sortAdmin('kegiatan')">Kegiatan ⇅</th>
            <th class="px-4 py-3 cursor-pointer" onclick="sortAdmin('wilayah')">Wilayah ⇅</th>
            <th class="px-4 py-3 cursor-pointer" onclick="sortAdmin('pelaksanaan')">Pelaksanaan ⇅</th>
            <th class="px-4 py-3 cursor-pointer" onclick="sortAdmin('usulan1')">Usulan 1 ⇅</th>
          </tr>
        </thead>
        <tbody id="adTableBody" class="divide-y"></tbody>
      </table>
    </div>
  </div>

  <!-- FOOTER -->
  <footer class="absolute bottom-4 w-full text-center text-xs text-gray-400 font-medium">
    &copy; 2026 App Dibuat oleh <a href="https://wa.me/6285342540658" target="_blank" class="text-blue-500 font-semibold hover:underline">Wadah Digital</a>
  </footer>

  <script>
    const SCRIPT_URL = "URL_APPSCRIPT_ANDA_DISINI"; 
    let masterData = {};
    let sortAsc = true;

    window.onload = async () => {
      // Mock data jika AppScript belum dipasang URL nya
      if(SCRIPT_URL === "https://script.google.com/macros/s/AKfycbwOs_PQC97QQcEb65pAD5q8sScf_rbDgED00inFJ3x7iLilWFJCk_DQUcKknnxJBDI-KQ/exec") {
         masterData = { pendampingDPP: ["Ustadz A (Ketua)", "Ustadz B (Wasekjen)"], pendampingDPW: ["Ustadz C (Ketua)"], wilayahDPW: ["11 - Aceh"], wilayahDPD: ["11.01 - Banda Aceh"] };
      } else {
         const res = await fetch(SCRIPT_URL);
         masterData = await res.json();
      }
      renderUsulan();
    };

    function formatWA(el) {
      el.value = el.value.replace(/\D/g, '');
      if(el.value.startsWith('08')) el.value = '628' + el.value.substring(2);
    }

    function toggleKegiatan() {
      const keg = document.querySelector('input[name="kegiatan"]:checked')?.value;
      const wilC = document.getElementById("wilayahContainer");
      const selW = document.getElementById("selWilayah");
      const lbl = document.getElementById("lblWilayah");
      
      if(keg) {
        wilC.classList.remove("hidden");
        selW.innerHTML = "";
        lbl.innerText = keg === "Mukerwil" ? "Pilih DPW" : "Pilih DPD";
        let arr = keg === "Mukerwil" ? masterData.wilayahDPW : masterData.wilayahDPD;
        (arr || []).forEach(x => { selW.innerHTML += `<option value="${x}">${x}</option>` });
      }
      renderUsulan();
    }

    function toggleHonor() {
      const isChecked = document.getElementById("chkHonor").checked;
      const c = document.getElementById("nominalContainer");
      if(isChecked) c.classList.remove("hidden"); else { c.classList.add("hidden"); document.getElementById("inpNominal").value = ""; document.getElementById("realNominal").value = "0"; }
    }

    function formatRupiah(el) {
      let num = el.value.replace(/\D/g, "");
      document.getElementById("realNominal").value = num;
      if(num) el.value = "Rp " + parseInt(num).toLocaleString('id-ID'); else el.value = "";
    }

    function renderUsulan() {
      const keg = document.querySelector('input[name="kegiatan"]:checked')?.value;
      const c = document.getElementById("usulanContainer");
      c.innerHTML = "";
      for(let i=1; i<=3; i++) {
        let html = `<div class="mb-3"><label class="block text-xs text-gray-500 mb-1">Usulan ${i}</label>`;
        if(!keg || keg === "Mukerwil") {
          html += `<select id="usul${i}" class="input-apple"><option value="">-- Pilih Pendamping (Daftar) --</option>`;
          (masterData.pendampingDPP || []).forEach(x => { html += `<option value="${x}">${x}</option>` });
          html += `</select>`;
        } else {
          html += `<div class="flex gap-2 mb-2">
            <select class="input-apple w-1/3" onchange="toggleSumberUsulan(this, ${i})">
              <option value="DPP">Dari DPP</option><option value="DPW">Dari DPW</option>
            </select>
            <select id="usul${i}_sel" class="input-apple w-2/3"><option value="">-- Pilih Pendamping (Daftar DPP) --</option>`;
          (masterData.pendampingDPP || []).forEach(x => { html += `<option value="${x}">${x}</option>` });
          html += `</select><input type="text" id="usul${i}_txt" class="input-apple w-2/3 hidden" style="text-transform:uppercase" placeholder="Ketik Manual (Auto Capslock)...">
          </div>`;
        }
        html += `</div>`;
        c.innerHTML += html;
      }
    }

    function toggleSumberUsulan(sel, idx) {
      const v = sel.value;
      const s = document.getElementById(`usul${idx}_sel`);
      const t = document.getElementById(`usul${idx}_txt`);
      if(v === "DPP") { s.classList.remove("hidden"); t.classList.add("hidden"); t.value = ""; }
      else { s.classList.add("hidden"); t.classList.remove("hidden"); s.value = ""; }
    }

    async function submitData() {
      const keg = document.querySelector('input[name="kegiatan"]:checked')?.value;
      if(!keg) return alert("Pilih kegiatan!");
      
      const payload = {
        wa: document.getElementById("waInput").value,
        kegiatan: keg,
        wilayah: document.getElementById("selWilayah").value,
        mulai: document.getElementById("jadwalMulai").value,
        selesai: document.getElementById("jadwalSelesai").value,
        pelaksanaan: document.querySelector('input[name="pelaksanaan"]:checked')?.value || "",
        kehadiran: document.querySelector('input[name="kehadiran"]:checked')?.value || "",
        tanggungan: Array.from(document.querySelectorAll('input[type="checkbox"]:checked')).map(c => c.value).join(", "),
        nominal: document.getElementById("realNominal").value,
        fokus: document.getElementById("inpFokus").value,
        keterangan: document.getElementById("inpKet").value
      };

      for(let i=1; i<=3; i++) {
        if(keg === "Mukerwil") payload[`usulan${i}`] = document.getElementById(`usul${i}`).value;
        else {
          let s = document.getElementById(`usul${i}_sel`); let t = document.getElementById(`usul${i}_txt`);
          payload[`usulan${i}`] = !s.classList.contains("hidden") ? s.value : t.value.toUpperCase();
        }
      }

      document.getElementById("btnSubmit").innerText = "Menyimpan...";
      try {
        if(SCRIPT_URL === "URL_APPSCRIPT_ANDA_DISINI") { alert("Harap isi URL AppScript di source code!"); document.getElementById("btnSubmit").innerText = "Simpan Data"; return; }
        await fetch(SCRIPT_URL, { method: "POST", body: JSON.stringify(payload) });
        alert("Data Berhasil Disimpan!"); location.reload();
      } catch(e) { alert("Error"); document.getElementById("btnSubmit").innerText = "Simpan Data"; }
    }

    async function openAdmin() {
      document.getElementById("appView").classList.add("hidden");
      document.getElementById("adminView").classList.remove("hidden");
      document.getElementById("adTableBody").innerHTML = `<tr><td colspan="6" class="text-center py-4 text-gray-400">Loading...</td></tr>`;
      try {
        const res = await fetch(SCRIPT_URL + "?action=get_admin");
        const data = await res.json();
        window.adminData = data.riwayat || [];
        filterAdmin();
      } catch(e) { document.getElementById("adTableBody").innerHTML = `<tr><td colspan="6" class="text-center text-red-500 py-4">Gagal terhubung ke AppScript.</td></tr>`; }
    }

    function closeAdmin() { document.getElementById("adminView").classList.add("hidden"); document.getElementById("appView").classList.remove("hidden"); }

    function filterAdmin() {
      const search = document.getElementById("adSearch").value.toLowerCase();
      const keg = document.getElementById("adFilterKeg").value;
      const tbody = document.getElementById("adTableBody"); tbody.innerHTML = "";
      
      window.filteredData = (window.adminData || []).filter(r => 
        (r.pic.toLowerCase().includes(search) || r.wilayah.toLowerCase().includes(search)) &&
        (keg === "" || r.kegiatan === keg)
      );

      renderTable();
    }

    function sortAdmin(col) {
      sortAsc = !sortAsc;
      window.filteredData.sort((a, b) => {
        let valA = a[col].toLowerCase();
        let valB = b[col].toLowerCase();
        if (valA < valB) return sortAsc ? -1 : 1;
        if (valA > valB) return sortAsc ? 1 : -1;
        return 0;
      });
      renderTable();
    }

    function renderTable() {
      const tbody = document.getElementById("adTableBody"); tbody.innerHTML = "";
      window.filteredData.forEach(r => {
        tbody.innerHTML += `
          <tr class="hover:bg-gray-50 transition">
            <td class="px-4 py-3">${r.tanggal}</td>
            <td class="px-4 py-3 font-medium">${r.pic}</td>
            <td class="px-4 py-3 font-semibold text-blue-600">${r.kegiatan}</td>
            <td class="px-4 py-3">${r.wilayah}</td>
            <td class="px-4 py-3 text-xs">${r.pelaksanaan}</td>
            <td class="px-4 py-3 text-xs text-gray-500">${r.usulan1}</td>
          </tr>
        `;
      });
      if(!window.filteredData.length) tbody.innerHTML = `<tr><td colspan="6" class="text-center py-4 text-gray-400">Data tidak ditemukan.</td></tr>`;
    }
  </script>
</body>
</html>
